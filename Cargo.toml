[workspace]
resolver = "3"
members = ["crates/ffsp-linux", "crates/fileshare-linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ffsp-protocol = { path = "../ffsp-protocol" }
anyhow = "1.0.104"
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
vello_encoding = { path = "../vendor/vello_encoding-0.6.0" }
